[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffdiff"
version = "0.1.0"
description = "Model diffing harness for quantization and merge verification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
models = ["transformers>=4.40", "datasets>=2.18", "bitsandbytes>=0.43"]
dev = ["pytest>=8.0"]

[project.scripts]
diffdiff = "diffdiff.cli:main"

[tool.setuptools.packages.find]
include = ["diffdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
